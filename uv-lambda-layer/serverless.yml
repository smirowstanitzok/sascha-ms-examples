# serverless.yml
service: bakery
frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.14
  architecture: arm64
  region: eu-central-1
  memorySize: 512
  timeout: 10
  logRetentionInDays: 14

package:
  patterns:
    - "!**"
    - "bakery/**"
    - "!**/__pycache__/**"

layers:
  dependencies:
    path: build/layer
    name: bakery-${sls:stage}-deps
    description: pydantic & co. from uv.lock
    compatibleRuntimes:
      - python3.14
    compatibleArchitectures:
      - arm64

functions:
  price:
    handler: bakery.handler.handler
    layers:
      - !Ref DependenciesLambdaLayer
    events:
      - httpApi:
          path: /price
          method: post
