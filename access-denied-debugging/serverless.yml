# serverless.yml
service: bike-returns
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: eu-central-1
  logRetentionInDays: 14
  environment:
    RETURNS_QUEUE_URL:
      Ref: ReturnsQueue
  iam:
    role:
      statements:
        # Step 1: leave this statement commented out to provoke AccessDenied.
        # Step 5: enable it again and redeploy.
        # - Effect: Allow
        #   Action: sqs:SendMessage
        #   Resource:
        #     Fn::GetAtt: [ReturnsQueue, Arn]
        - Effect: Allow
          Action: sqs:GetQueueAttributes
          Resource:
            Fn::GetAtt: [ReturnsQueue, Arn]

functions:
  reportReturn:
    handler: src/handler.handler
    events:
      - httpApi:
          method: POST
          path: /returns

resources:
  Resources:
    ReturnsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}
        MessageRetentionPeriod: 345600
