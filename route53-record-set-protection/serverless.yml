# serverless.yml
service: dns-guard
frameworkVersion: "4"

params:
  default:
    hostedZoneId: Z0123456789EXAMPLE

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: eu-central-1
  memorySize: 256
  timeout: 60
  logRetentionInDays: 30
  environment:
    HOSTED_ZONE_ID: ${param:hostedZoneId}
    AUTO_REPAIR: "true"
  iam:
    role:
      statements:
        # Read and create yes, delete deliberately not
        - Effect: Allow
          Action:
            - route53:ListResourceRecordSetProtections
            - route53:CreateResourceRecordSetProtections
          Resource: arn:aws:route53:::hostedzone/${param:hostedZoneId}

functions:
  check:
    handler: src/handler.handler
    events:
      - schedule: cron(0/30 6-20 ? * MON-FRI *)

resources:
  Resources:
    MissingProtectionsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: A DNS protection was missing (Route 53 record set protection)
        Namespace: DnsGuard
        MetricName: MissingProtections
        Dimensions:
          - Name: HostedZoneId
            Value: ${param:hostedZoneId}
        Statistic: Maximum
        Period: 1800
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
