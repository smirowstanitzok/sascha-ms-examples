# serverless.yml
service: bike-rental-timeouts
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  memorySize: 512
  environment:
    TABLE_NAME: !Ref BikesTable
    PARTNER_BASE_URL: https://maintenance.example.com
    API_BUDGET_MS: '8000'
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource: !GetAtt BikesTable.Arn

functions:
  availability:
    handler: src/handler.handler
    timeout: 10 # well below the 30 s of API Gateway (HTTP API)
    events:
      - httpApi: GET /bikes/{bikeId}/availability

  returnReminder:
    handler: src/worker.handler
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ReminderQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    BikesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH

    ReminderDLQ:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600 # 14 days

    ReminderQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360 # 6 × 60 s function timeout
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ReminderDLQ.Arn
          maxReceiveCount: 5
