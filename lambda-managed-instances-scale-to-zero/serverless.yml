# serverless.yml
service: bike-rental-reports
frameworkVersion: '4'

params:
  default:
    # For testing: enter two subnets and a security group from the default VPC
    subnetA: subnet-aaaa1111
    subnetB: subnet-bbbb2222
    securityGroup: sg-cccc3333

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64        # must match the capacity provider
  region: eu-central-1
  memorySize: 2048
  timeout: 300
  versionFunctions: false    # no numbered versions – each would start its own environments

functions:
  maintenanceReport:
    handler: src/handler.handler

resources:
  Resources:
    ReportOperatorRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/AWSLambdaManagedEC2ResourceOperator

    ReportCapacityProvider:
      Type: AWS::Lambda::CapacityProvider
      Properties:
        CapacityProviderName: ${self:service}-${sls:stage}
        PermissionsConfig:
          CapacityProviderOperatorRoleArn: !GetAtt ReportOperatorRole.Arn
        VpcConfig:
          SubnetIds:
            - ${param:subnetA}
            - ${param:subnetB}
          SecurityGroupIds:
            - ${param:securityGroup}
        InstanceRequirements:
          Architectures: [arm64]
        CapacityProviderScalingConfig:
          MaxVCpuCount: 16   # cost brake for the whole provider

    # Weekdays 6:45: pre-warm one environment – startup takes a few minutes
    WarmUpSchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        ScheduleExpression: cron(45 6 ? * MON-FRI *)
        ScheduleExpressionTimezone: Europe/Berlin
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          Arn: arn:aws:scheduler:::aws-sdk:lambda:putFunctionScalingConfig
          RoleArn: !GetAtt SchedulerRole.Arn
          Input: !Join
            - ''
            - - '{"FunctionName":"'
              - !Ref MaintenanceReportLambdaFunction
              - '","Qualifier":"$LATEST.PUBLISHED","FunctionScalingConfig":{"MinExecutionEnvironments":1,"MaxExecutionEnvironments":6}}'

    # Weekdays 19:00: back to zero
    CoolDownSchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        ScheduleExpression: cron(0 19 ? * MON-FRI *)
        ScheduleExpressionTimezone: Europe/Berlin
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          Arn: arn:aws:scheduler:::aws-sdk:lambda:putFunctionScalingConfig
          RoleArn: !GetAtt SchedulerRole.Arn
          Input: !Join
            - ''
            - - '{"FunctionName":"'
              - !Ref MaintenanceReportLambdaFunction
              - '","Qualifier":"$LATEST.PUBLISHED","FunctionScalingConfig":{"MinExecutionEnvironments":0,"MaxExecutionEnvironments":6}}'

    SchedulerRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: scheduler.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: put-scaling-config
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:PutFunctionScalingConfig
                  Resource:
                    - !GetAtt MaintenanceReportLambdaFunction.Arn
                    - !Join ['', [!GetAtt MaintenanceReportLambdaFunction.Arn, ':*']]

  extensions:
    # Adds the LMI settings to the function generated by Serverless
    MaintenanceReportLambdaFunction:
      Properties:
        CapacityProviderConfig:
          LambdaManagedInstancesCapacityProviderConfig:
            CapacityProviderArn: !GetAtt ReportCapacityProvider.Arn
            PerExecutionEnvironmentMaxConcurrency: 32
        PublishToLatestPublished: true
        FunctionScalingConfig:
          MinExecutionEnvironments: 0   # Scale to Zero
          MaxExecutionEnvironments: 6
