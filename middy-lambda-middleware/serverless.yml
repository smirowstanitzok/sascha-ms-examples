# serverless.yml
service: library-loans
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-central-1
  memorySize: 512
  timeout: 10
  logRetentionInDays: 14

build:
  esbuild:
    bundle: true
    minify: false

functions:
  createLoan:
    handler: src/handlers/create-loan.handler
    events:
      - httpApi:
          path: /loans
          method: post
