# serverless.yml
service: radverleih-schadensfotos
frameworkVersion: "4"

custom:
  bucketName: ${self:service}-${sls:stage}-${aws:accountId}
  erlaubterUrsprung: https://app.radverleih.example

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: eu-central-1
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  environment:
    BUCKET_NAME: ${self:custom.bucketName}
  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.erlaubterUrsprung}
      allowedMethods: [POST]
      allowedHeaders: [content-type, authorization]
  s3:
    # The Serverless Framework creates this bucket and wires up the S3 event
    schadensfotos:
      name: ${self:custom.bucketName}
      publicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      corsConfiguration:
        CorsRules:
          - AllowedOrigins: ["${self:custom.erlaubterUrsprung}"]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      lifecycleConfiguration:
        Rules:
          # Anything not checked disappears after one day
          - Id: eingang-aufraeumen
            Status: Enabled
            Prefix: eingang/
            ExpirationInDays: 1
  iam:
    role:
      statements:
        # May only write to the inbox folder – this also signs the upload URL
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::${self:custom.bucketName}/eingang/*
        # Check function: read and clean up the inbox, store checked photos
        - Effect: Allow
          Action: [s3:GetObject, s3:DeleteObject]
          Resource: arn:aws:s3:::${self:custom.bucketName}/eingang/*
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::${self:custom.bucketName}/geprueft/*

functions:
  uploadUrl:
    handler: src/upload-url.handler
    events:
      - httpApi:
          method: POST
          path: /ausleihen/{ausleihId}/schadensfotos
  pruefeUpload:
    handler: src/check-upload.handler
    events:
      - s3:
          bucket: schadensfotos
          event: s3:ObjectCreated:*
          rules:
            - prefix: eingang/

