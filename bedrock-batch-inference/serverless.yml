# serverless.yml
service: bookshop-review-batch
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  memorySize: 512
  timeout: 300
  environment:
    DATA_BUCKET: !Ref DataBucket
    BATCH_ROLE_ARN: !GetAtt BatchInferenceRole.Arn
    MODEL_ID: ${param:modelId, 'anthropic.claude-3-haiku-20240307-v1:0'}
    MIN_RECORDS: '100'
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [s3:GetObject, s3:PutObject]
          Resource: !Sub '${DataBucket.Arn}/*'
        - Effect: Allow
          Action: s3:ListBucket
          Resource: !GetAtt DataBucket.Arn
        - Effect: Allow
          Action: [bedrock:CreateModelInvocationJob, bedrock:GetModelInvocationJob]
          Resource: '*'
        - Effect: Allow
          Action: iam:PassRole
          Resource: !GetAtt BatchInferenceRole.Arn
          Condition:
            StringEquals:
              iam:PassedToService: bedrock.amazonaws.com

functions:
  submitBatch:
    handler: src/submit-batch.handler
    events:
      - schedule: cron(15 2 * * ? *) # every night at 02:15 UTC
  collectResults:
    handler: src/collect-results.handler
    events:
      - eventBridge:
          pattern:
            source: [aws.bedrock]
            detail-type: [Batch Inference Job State Change]
            detail:
              status: [Completed, PartiallyCompleted, Failed, Expired, Stopped]

resources:
  Resources:
    DataBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: delete-old-batch-files
              Status: Enabled
              Prefix: batch-
              ExpirationInDays: 30

    # Bedrock itself assumes this role to read inputs and write outputs.
    BatchInferenceRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: bedrock.amazonaws.com
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                ArnLike:
                  aws:SourceArn: !Join
                    - ':'
                    - [arn:aws:bedrock, !Ref AWS::Region, !Ref AWS::AccountId, 'model-invocation-job/*']
        Policies:
          - PolicyName: batch-data
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub '${DataBucket.Arn}/batch-input/*'
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub '${DataBucket.Arn}/batch-output/*'
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !GetAtt DataBucket.Arn
