# ci/github-actions.yml – copy to .github/workflows/integration-tests.yml in your project
name: integration-tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install AWS Emulator
        run: |
          curl -fsSLo aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator.deb
          aws-emulator -v
      - name: Start AWS Emulator
        run: |
          aws-emulator --telemetry off --idle-timeout 900 > emulator.log 2>&1 &
          bash scripts/wait-for-emulator.sh
      - run: npm ci
      - name: Run integration tests
        run: |
          source scripts/emulator-env.sh
          npm run test:int
