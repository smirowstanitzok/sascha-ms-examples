# serverless.yml
service: library-downloads
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-central-1
  memorySize: 256
  timeout: 10
  httpApi:
    authorizers:
      readerJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${param:jwtIssuerUrl}
        audience:
          - ${param:jwtAudience}
  environment:
    LOANS_TABLE: !Ref LoansTable
    DOWNLOAD_DOMAIN: !GetAtt DownloadDistribution.DomainName
    KEY_PAIR_ID: !Ref ReaderPublicKey
    PRIVATE_KEY_PARAM: /library/${sls:stage}/cloudfront/private-key
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource: !GetAtt LoansTable.Arn
        - Effect: Allow
          Action: ssm:GetParameter
          Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/library/${sls:stage}/cloudfront/private-key

functions:
  signDownload:
    handler: src/handler.handler
    events:
      - httpApi:
          method: GET
          path: /books/{bookId}/download
          authorizer:
            name: readerJwt

resources:
  Resources:
    BooksBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    LoansTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: readerId, AttributeType: S }
          - { AttributeName: bookId, AttributeType: S }
        KeySchema:
          - { AttributeName: readerId, KeyType: HASH }
          - { AttributeName: bookId, KeyType: RANGE }

    ReaderPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          Name: library-${sls:stage}-reader-key-1
          CallerReference: library-${sls:stage}-reader-key-1
          EncodedKey: ${ssm:/library/${sls:stage}/cloudfront/public-key}

    ReaderKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: library-${sls:stage}-readers
          Items:
            - !Ref ReaderPublicKey

    BooksOriginAccess:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: library-${sls:stage}-books-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    DownloadDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Signed e-book downloads
          Origins:
            - Id: books
              DomainName: !GetAtt BooksBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt BooksOriginAccess.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: books
            ViewerProtocolPolicy: https-only
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            TrustedKeyGroups:
              - !Ref ReaderKeyGroup

    BooksBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BooksBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt BooksBucket.Arn, "/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join ["", ["arn:aws:cloudfront::${aws:accountId}:distribution/", !Ref DownloadDistribution]]

  Outputs:
    BooksBucketName:
      Value: !Ref BooksBucket
    DownloadDomain:
      Value: !GetAtt DownloadDistribution.DomainName
    LoansTableName:
      Value: !Ref LoansTable
